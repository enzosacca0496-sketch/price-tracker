name: Tracker prezzi

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # avvio manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: tracker-prezzi
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Controllo prezzi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Salva stato
        run: |
          git config user.name "tracker-prezzi"
          git config user.email "tracker-prezzi@users.noreply.github.com"
          git add state.json products.yaml
          git diff --cached --quiet || (git commit -m "Aggiorna prezzi" && git pull --rebase -q && git push)
